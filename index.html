<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Missão Programador</title>

<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}

body {
font-family: Arial, sans-serif;
background: linear-gradient(135deg, #17152b, #392477);
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
padding: 20px;
color: white;
}

.caixa-principal {
background-color: #ffffff;
color: #222;
width: 100%;
max-width: 700px;
padding: 35px;
border-radius: 20px;
box-shadow: 0 0 25px rgba(0, 0, 0, 0.3);
text-align: center;
}

h1 {
color: #5429a8;
margin-bottom: 25px;
font-size: 32px;
}

.caixa-perguntas {
font-size: 21px;
font-weight: bold;
margin-bottom: 25px;
line-height: 1.5;
}

.caixa-alternativas {
display: flex;
flex-direction: column;
gap: 15px;
}

.caixa-alternativas button {
background-color: #eee8ff;
color: #302052;
border: 2px solid #7b52d3;
padding: 15px;
border-radius: 12px;
font-size: 16px;
cursor: pointer;
transition: 0.3s;
}

.caixa-alternativas button:hover {
background-color: #7b52d3;
color: white;
transform: scale(1.02);
}

.caixa-resultado {
margin-top: 25px;
}

.texto-resultado {
font-size: 18px;
line-height: 1.7;
}

.botao-reiniciar {
margin-top: 25px;
padding: 12px 25px;
border: none;
border-radius: 10px;
background-color: #5429a8;
color: white;
font-size: 16px;
cursor: pointer;
}

.botao-reiniciar:hover {
background-color: #3c1c7c;
}
</style>
</head>

<body>

<div class="caixa-principal">

<h1>🚀 Missão Programador</h1>

<div class="caixa-perguntas"></div>

<div class="caixa-alternativas"></div>

<div class="caixa-resultado">
<p class="texto-resultado"></p>
</div>

</div>

<script>

const caixaPerguntas = document.querySelector(".caixa-perguntas");
const caixaAlternativas = document.querySelector(".caixa-alternativas");
const textoResultado = document.querySelector(".texto-resultado");

const perguntas = [

{
enunciado: "Quando você começa um novo projeto, o que prefere fazer primeiro?",

alternativas: [
{
texto: "Planejar tudo antes de começar.",
resultado: "Você demonstra organização e gosta de planejar suas tarefas."
},

{
texto: "Começar logo e aprender durante o projeto.",
resultado: "Você demonstra iniciativa e gosta de aprender fazendo."
}
]
},

{
enunciado: "Quando aparece um erro no seu código, o que você faz?",

alternativas: [
{
texto: "Pesquiso e tento encontrar a solução sozinho.",
resultado: "Você demonstra independência e facilidade para pesquisar soluções."
},

{
texto: "Peço ajuda para alguém.",
resultado: "Você valoriza a colaboração e a troca de conhecimentos."
}
]
},

{
enunciado: "O que é mais importante em um site?",

alternativas: [
{
texto: "Que ele funcione corretamente.",
resultado: "Você é uma pessoa prática e valoriza a funcionalidade."
},

{
texto: "Que ele seja bonito e fácil de usar.",
resultado: "Você é uma pessoa detalhista e valoriza a experiência do usuário."
}
]
},

{
enunciado: "Como você se sente ao aprender uma tecnologia nova?",

alternativas: [
{
texto: "Prefiro aperfeiçoar aquilo que já conheço.",
resultado: "Você demonstra foco e gosta de dominar suas ferramentas."
},

{
texto: "Gosto de experimentar coisas novas.",
resultado: "Você demonstra curiosidade e vontade de aprender."
}
]
},

{
enunciado: "Como você prefere trabalhar em um projeto?",

alternativas: [
{
texto: "Sozinho, cuidando de todas as partes.",
resultado: "Você demonstra independência e gosta de ter controle sobre o projeto."
},

{
texto: "Em equipe, dividindo as tarefas.",
resultado: "Você valoriza o trabalho em equipe e a colaboração."
}
]
}

];

let perguntaAtual = 0;
let resultadoFinal = "";

function mostrarPergunta() {

if (perguntaAtual >= perguntas.length) {
mostrarResultado();
return;
}

const pergunta = perguntas[perguntaAtual];

caixaPerguntas.textContent = pergunta.enunciado;

caixaAlternativas.innerHTML = "";

for (const alternativa of pergunta.alternativas) {

const botao = document.createElement("button");

botao.textContent = alternativa.texto;

botao.addEventListener("click", function() {

resultadoFinal += alternativa.resultado + "<br><br>";

perguntaAtual++;

mostrarPergunta();

});

caixaAlternativas.appendChild(botao);
}
}

function mostrarResultado() {

caixaPerguntas.textContent =
"🎉 Missão concluída!";

caixaAlternativas.innerHTML = "";

textoResultado.innerHTML =
"<strong>Veja o que suas respostas mostram sobre você:</strong><br><br>" +
resultadoFinal;

const botaoReiniciar = document.createElement("button");

botaoReiniciar.textContent = "Fazer novamente";

botaoReiniciar.classList.add("botao-reiniciar");

botaoReiniciar.addEventListener("click", function() {

perguntaAtual = 0;

resultadoFinal = "";

textoResultado.innerHTML = "";

mostrarPergunta();

});

caixaAlternativas.appendChild(botaoReiniciar);
}

mostrarPergunta();

</script>

</body>
</html>
